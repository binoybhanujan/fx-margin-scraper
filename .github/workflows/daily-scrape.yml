name: Daily FX scrape

on:
  schedule:
    # 18:00 IST = 12:30 UTC
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape rates
        run: python scripts/scrape.py -q

      - name: Commit consolidated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/consolidated
          git diff --staged --quiet && echo "No data changes" && exit 0
          git commit -m "chore: daily FX rates $(date -u +%Y-%m-%d)"
          git push
