[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-margin-scraper"
version = "0.1.0"
description = "Multi-bank FX rate scraper with daily scheduling and trend visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
fx-scrape = "fx_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
